name: Deploy Frontend
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-frontend
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.DEPLOYMENT_ENABLED == 'true' &&
      vars.AZURE_WEBAPP_NAME_FRONTEND != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_DEV_TOOLS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a Stripe test publishable key
        shell: bash
        run: |
          if [[ "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" != pk_test_* || "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" == *replace* ]]; then
            echo 'Configure the Stripe test publishable-key secret before deployment.'
            exit 1
          fi
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/package_release.py frontend
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_FRONTEND }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: .release/frontend.zip
