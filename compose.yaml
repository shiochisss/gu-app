services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pickup
      POSTGRES_USER: pickup_app
      POSTGRES_PASSWORD: pickup_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup_app -d pickup"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
