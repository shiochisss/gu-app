services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pickup_local_root
      MYSQL_DATABASE: pickup
      MYSQL_USER: pickup_app
      MYSQL_PASSWORD: pickup_local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
